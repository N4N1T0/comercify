name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # trusted publishing: npm authenticates the workflow with its OIDC token,
  # no NPM_TOKEN secret, and signs the provenance with it
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        # trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@^11.5.1

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Publish package
        run: npm publish --access public
